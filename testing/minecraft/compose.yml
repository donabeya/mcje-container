services:
    mc:
        image: itzg/minecraft-server:java25
        ports:
            - '25565:25565'
            - 24454:24454/udp
            - 36123:36123/tcp
            - '8100:8100'
            - 127.0.0.1:19565:19565
        volumes:
            - ./minecraft-data:/data:Z
            - ./config/mod:/config:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            EULA: 'TRUE'
            SERVER_NAME: どな鯖
            TYPE: NEOFORGE
            NEOFORGE_VERSION: 21.1.213
            VERSION: 1.21.1
            DIFFICULTY: hard
            ALLOW_FLIGHT: true
            MODE: survival
            MAX_PLAYERS: 30
            ENABLE_COMMAND_BLOCK: true
            FORCE_GAMEMODE: false
            PACKWIZ_URL: https://raw.githubusercontent.com/donabeya/mcje-container/refs/heads/develop/testing/minecraft/packwiz/pack.toml
            COPY_CONFIG_DEST: /data/config
            RCON_PASSWORD: testing
            LEVEL_TYPE: large_biomes
            INIT_MEMORY: 4G
            MAX_MEMORY: 11G
            LOG_TIMESTAMP: true
            ENABLE_ROLLING_LOGS: true
            SNOOPER_ENABLED: false
            VIEW_DISTANCE: 16
            SPAWN_PROTECTION: 0
            USE_AIKAR_FLAGS: true
            USE_MEOWICE_FLAGS: true
        networks:
            server:
                ipv4_address: 10.55.0.2

    backup:
        image: itzg/mc-backup
        depends_on:
            - mc
        volumes:
            - ./config/rclone/rclone.conf:/config/rclone/rclone.conf:ro
            - ./minecraft-data:/data:ro
            - ./backups:/backups
        environment:
            BACKUP_INTERVAL: 24h
            RCON_HOST: mc
            RCON_PASSWORD: testing
            PRUNE_BACKUPS_DAYS: 14
            BACKUP_METHOD: rclone
            RCLONE_REMOTE: rclone-testing
            RCLONE_COMPRESS_METHOD: gzip
            DEST_DIR: ./backups
            RCLONE_DEST_DIR: /neoforge_backup
        networks:
            server:
                ipv4_address: 10.55.0.5
        user: root

    grafana:
        image: grafana/grafana:main
        depends_on:
            - prometheus
        ports:
            - '3000:3000'
        volumes:
            - ./grafana/data:/var/lib/grafana
        networks:
            server:
                ipv4_address: 10.55.0.3
        user: root

    prometheus:
        image: prom/prometheus:main
        ports:
            - 127.0.0.1:9090:9090
        volumes:
            - ./prometheus/data:/prometheus
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        networks:
            server:
                ipv4_address: 10.55.0.4
        user: root

networks:
    server:
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: 10.55.0.0/16
                  gateway: 10.55.0.1
