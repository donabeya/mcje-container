services:
    caddy:
        image: caddy:latest
        container_name: caddy
        ports:
            - "8080:80"
        volumes:
            - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
        restart: unless-stopped
        networks:
            server:
                ipv4_address: 10.55.0.6

    mc:
        container_name: mc
        image: docker.io/itzg/minecraft-server:java25
        restart: unless-stopped
        ports:
            - "25565:25565"
            - 24454:24454/udp
            - 36123:36123/tcp
            - 127.0.0.1:19565:19565
        volumes:
            - ./minecraft-data:/data:Z
            - ./config/mod:/config:ro
            - /etc/localtime:/etc/localtime:ro
        environment:
            EULA: "TRUE"
            SERVER_NAME: どな鯖
            TYPE: NEOFORGE
            NEOFORGE_VERSION: 21.1.213
            VERSION: 1.21.1
            DIFFICULTY: hard
            ALLOW_FLIGHT: true
            MODE: survival
            MAX_PLAYERS: 30
            ENABLE_COMMAND_BLOCK: true
            FORCE_GAMEMODE: false
            PACKWIZ_URL: https://raw.githubusercontent.com/donabeya/packwiz/refs/heads/main/release/pack.toml
            COPY_CONFIG_DEST: /data/config
            RCON_PASSWORD: samidare44
            LEVEL_TYPE: large_biomes
            INIT_MEMORY: 6G
            MAX_MEMORY: 11G
            LOG_TIMESTAMP: true
            ENABLE_ROLLING_LOGS: true
            SNOOPER_ENABLED: false
            VIEW_DISTANCE: 20
            SPAWN_PROTECTION: 0
            USE_AIKAR_FLAGS: true
            USE_MEOWICE_FLAGS: true
        networks:
            server:
                ipv4_address: 10.55.0.2

    backup:
        container_name: backup
        image: docker.io/itzg/mc-backup
        depends_on:
            - mc
        volumes:
            - ./config/rclone/rclone.conf:/config/rclone/rclone.conf:ro
            - ./minecraft-data/world:/data:ro
            - ./backups:/backups
        environment:
            BACKUP_INTERVAL: 48h
            RCON_HOST: mc
            RCON_PASSWORD: samidare44
            PRUNE_BACKUPS_DAYS: 14
            BACKUP_METHOD: rclone
            RCLONE_REMOTE: donasava
            RCLONE_COMPRESS_METHOD: gzip
            DEST_DIR: ./backups
            RCLONE_DEST_DIR: /neoforge_backup
        networks:
            server:
                ipv4_address: 10.55.0.5
        cpuset: "0,6"
        user: root

    grafana:
        container_name: grafana
        image: docker.io/grafana/grafana:main
        restart: unless-stopped
        depends_on:
            - prometheus
        volumes:
            - ./grafana/data:/var/lib/grafana
        networks:
            server:
                ipv4_address: 10.55.0.3
        environment:
            - GF_SERVER_ROOT_URL=https://nexus.tailf2b158.ts.net/grafana/
            - GF_SERVER_SERVE_FROM_SUB_PATH=true
        cpuset: "1"
    user: root

    prometheus:
        container_name: prometheus
        image: docker.io/prom/prometheus:main
        restart: unless-stopped
        ports:
          - 127.0.0.1:9090:9090
        volumes:
          - ./prometheus/data:/prometheus
          - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        networks:
          server:
            ipv4_address: 10.55.0.4
        cpuset: "1"
        user: root

networks:
  server:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.55.0.0/16
          gateway: 10.55.0.1
